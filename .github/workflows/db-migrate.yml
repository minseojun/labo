name: Deploy DB Migrations

# 수동 실행 전용 — 시크릿(SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID)이
# 저장소 Settings → Secrets에 등록되기 전까지는 그냥 실행만 안 될 뿐, 다른 CI에 영향 없음.
# Actions 탭에서 이 워크플로우를 수동으로 실행하면 supabase/migrations/의 안 적용된
# 마이그레이션만 원격 DB에 반영됨 (이미 적용된 건 건너뜀 — supabase db push가 알아서 함).
on:
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Link Supabase project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Push migrations
        run: npx supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
