name: Deploy DB Migrations

# main에 supabase/migrations/ 아래 파일이 새로 들어갈 때마다 자동으로 실행됨 —
# 예전엔 수동 실행 전용이라 마이그레이션 파일만 머지되고 실제 DB엔 반영 안 된 채
# 방치되는 사고가 있었음(코드는 새 컬럼을 쓰는데 DB엔 없어서 그 기능만 저장 실패).
# 필요하면 Actions 탭에서 수동 실행도 여전히 가능함. 시크릿(SUPABASE_ACCESS_TOKEN,
# SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID)이 저장소 Settings → Secrets에
# 등록되기 전까지는 그냥 실행만 안 될 뿐, 다른 CI에 영향 없음.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Link Supabase project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

      - name: Push migrations
        run: npx supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
